site_name: "CelestIQ · Orbital Intelligence Platform"
site_url: https://celestiq.dev
site_description: >-
  CelestIQ — An intelligent collision-avoidance decision-support and manoeuvre
  optimisation platform for satellite operators. Complete documentation covering
  architecture, algorithms, API contracts, and developer guides.
site_author: CelestIQ Team
repo_url: https://github.com/Shivanshi388/CelestIQ
repo_name: CelestIQ
edit_uri: edit/main/docs/
docs_dir: docs
site_dir: site

copyright: >-
  &copy; 2025 CelestIQ Team &mdash;
  <em>Educational &amp; Research Prototype. Not an operational flight-safety system.</em>

nav:
  - 🏠 Home: README.md
  - 🚀 Getting Started:
      - Overview: OVERVIEW.md
      - Quick Start: QUICKSTART.md
      - Installation: INSTALLATION.md
      - Configuration: CONFIGURATION.md
  - 🏗️ Architecture:
      - System Architecture: ARCHITECTURE.md
      - Data Flow: DATA_FLOW.md
      - System Design: SYSTEM_DESIGN.md
      - Design Decisions: DESIGN_DECISIONS.md
      - Project Structure: PROJECT_STRUCTURE.md
  - 🧠 Algorithms:
      - Algorithm Reference: ALGORITHM.md
      - Risk Scoring: RISK_SCORING.md
      - Orbit Propagation: ORBIT_PROPAGATION.md
      - Conjunction Detection: CONJUNCTION_DETECTION.md
      - Manoeuvre Optimisation: MANOEUVRE_OPTIMISATION.md
  - 🔌 API Reference:
      - API Contract: API_CONTRACT.md
      - Endpoints: API_ENDPOINTS.md
      - Authentication & Auth: AUTHENTICATION.md
      - Error Codes: ERROR_CODES.md
  - 🗄️ Data:
      - Data Sources: DATA_SOURCES.md
      - Database Schema: DATABASE.md
  - 🖥️ Frontend:
      - UI & UX Guide: UI_UX.md
      - Components: COMPONENTS.md
      - User Flows: USER_FLOWS.md
  - 🔒 Security:
      - Security Policy: SECURITY.md
      - Threat Model: THREAT_MODEL.md
  - 🧪 Testing:
      - Testing Guide: TESTING.md
      - Test Strategy: TEST_STRATEGY.md
      - Troubleshooting: TROUBLESHOOTING.md
  - 🤝 Contributing:
      - How to Contribute: CONTRIBUTING.md
      - Code of Conduct: CODE_OF_CONDUCT.md
      - Changelog: CHANGELOG.md
